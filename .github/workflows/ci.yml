name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck apkey.sh install.sh

  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: PREFIX="$RUNNER_TEMP/bin" ./install.sh
      - name: Generate keystore
        working-directory: ${{ runner.temp }}
        run: |
          printf 'ci.jks\nci\nCI\n\n\nci-pass-123\nci-pass-123\n' | "$RUNNER_TEMP/bin/apkey"
          unzip -o signKeystore.zip
          test -f signKeystore/keystore.properties
          test -f signKeystore/fingerprints.txt
          keytool -list -keystore signKeystore/ci.jks -storepass ci-pass-123 -alias ci
